# Publiserer appen i entur/ til GitHub Pages.
# Krever at Pages er satt til kilde «GitHub Actions» under Settings → Pages i repoet.
name: Publiser til GitHub Pages

on:
  push:
    branches: [main]
    paths: ["entur/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: entur
      - id: deployment
        uses: actions/deploy-pages@v4
